# Bundle-only configuration for the actual production entry, with no live IDs,
# routes, credentials or enabled sender. Use --dry-run, never deploy this file.
name = "asheerah-dashboard-bundle-check"
main = "../backend/worker.mjs"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "REVIEW_MEDIA"
bucket_name = "asheerah-dashboard-synthetic-local-only"
remote = false

[vars]
DASHBOARD_CUSTOMER_EMAIL_UI_ENABLED = "0"
DASHBOARD_CUSTOMER_EMAIL_SEND_ENABLED = "0"
