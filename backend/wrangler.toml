name = "asheerah-stripe-checkout-live"
main = "worker.mjs"
account_id = "2d816509775474bb3c5c6bf7affd7368"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "asheerahhair.com/gestao*", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/management-api/*", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/request-orange-money", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/create-checkout-session", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/public/*", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/review-media/*", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/reviews*", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/shipping-quote", zone_name = "asheerahhair.com" },
  { pattern = "asheerahhair.com/webhook", zone_name = "asheerahhair.com" }
]

[vars]
MANAGEMENT_CAPTURE_ENABLED = "1"
MANAGEMENT_HISTORY_CUTOFF = "2026-10-23T13:18:28Z"
ORDER_EMAIL_ENABLED = "1"
NEWSLETTER_ENABLED = "1"
# Conservative campaign allowance, independent of transactional receipts. Review provider capacity before raising.
NEWSLETTER_DAILY_LIMIT = "20"
MANUAL_ORDER_GAS_URL = "https://script.google.com/macros/s/AKfycbzKCanbiHbmlJkhhjy77g2LyTGef6jqcOBNp-2LmUsw21eOCJfSiATnLrw3i2lXlnMP/exec"
STRIPE_MODE = "live"
CHECKOUT_DIAGNOSTIC = "0"
SITE_ORIGIN = "https://asheerahhair.com"
SITE_ORIGINS = "https://jashe1728.github.io,https://asheerahhair.com,https://www.asheerahhair.com"
SITE_BASE_URL = "https://asheerahhair.com"
CATALOG_URL = "https://jashe1728.github.io/asheerah-hair/catalog.json"
GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwFhUUndMwUeXE58D2x9UtPJv00ZfM0QUsdrwgcxU0YQxzBazYKiVbEvkm_OnWCxND7/exec"

[[r2_buckets]]
binding = "REVIEW_MEDIA"
bucket_name = "asheerah-hair-review-media"

[triggers]
crons = ["*/10 * * * *"]
